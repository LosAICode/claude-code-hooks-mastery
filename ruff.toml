# ruff linter configuration
# https://docs.astral.sh/ruff/configuration/

target-version = "py312"

# Pin the rule set explicitly. Recent ruff versions enable a much broader default
# selection (I, UP, S, BLE, DTZ, FURB, RUF, ...). Without this, the per-file-ignores
# below are pointless: every file still fails on style rules nobody enumerated.
# Scope is "real errors only" — pyflakes plus the pycodestyle error subset.
[lint]
select = ["E4", "E7", "E9", "F"]

# Ignore rules that produce false positives or pre-existing issues in legacy codebases
[lint.per-file-ignores]
"**/master_admin.py" = ["F841", "F401", "E712", "F541", "E722", "E741", "F821"]
