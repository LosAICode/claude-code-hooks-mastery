# ty type checker configuration
# https://docs.astral.sh/ty/configuration/
#
# This is the STRICT config for files in this repo. The ten legacy silences that used to
# sit here (unresolved-attribute, invalid-argument-type, call-non-callable, ...) applied to
# every file ty inspects and emptied the builder agent's PostToolUse type check; they now
# live in ty.legacy.toml, which ty_validator.py applies only to files outside this repo.

[rules]
# Ignore unresolved imports for inline scripts that use PEP 723 uv script dependencies
# These dependencies are declared in script metadata and resolved at runtime by `uv run --script`
unresolved-import = "ignore"
